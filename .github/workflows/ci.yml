name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax & Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile & CLI smoke check
        run: |
          python -m py_compile run_app.py ssd_lifeguard/__init__.py ssd_lifeguard/__main__.py ssd_lifeguard/cli.py ssd_lifeguard/forensics.py ssd_lifeguard/gui.py ssd_lifeguard/optimizer.py ssd_lifeguard/write_hunter.py
          python -m ssd_lifeguard --help

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

name: Build and Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name win-ssd-lifeguard-windows-x64 --icon assets/icon.ico run_app.py
          Compress-Archive -Path dist/win-ssd-lifeguard-windows-x64.exe, README.md, LICENSE -DestinationPath dist/win-ssd-lifeguard-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/win-ssd-lifeguard-windows-x64.exe
            dist/win-ssd-lifeguard-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install pyinstaller .
      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --name win-ssd-lifeguard-linux-x64 run_app.py
          chmod +x dist/win-ssd-lifeguard-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/win-ssd-lifeguard-linux-x64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
      - name: Build macOS App Bundle & Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name win-ssd-lifeguard-macos-arm64 run_app.py
          cd dist
          tar -czf win-ssd-lifeguard-macos-arm64.tar.gz win-ssd-lifeguard-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/win-ssd-lifeguard-macos-arm64.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/win-ssd-lifeguard-windows-x64.exe
            release-assets/win-ssd-lifeguard-windows-x64.zip
            release-assets/win-ssd-lifeguard-linux-x64
            release-assets/win-ssd-lifeguard-macos-arm64.tar.gz
            release-assets/SHA256SUMS.txt
